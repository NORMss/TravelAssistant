# Единый каталог версий. Любое обновление библиотеки делается здесь и нигде больше.
# Проверить обновления:  ./gradlew dependencyUpdates   (плагин version-catalog-update)
[versions]
# --- сборка ---------------------------------------------------------------
agp = "9.4.1"
kotlin = "2.4.21"
ksp = "2.3.12"
hilt = "2.60.1"
# compileSdk/targetSdk/minSdk живут в build-logic/.../Config.kt

# --- androidx ядро --------------------------------------------------------
androidxCore = "1.18.0"
androidxActivity = "1.13.0"
androidxLifecycle = "2.10.0"
androidxHiltNavigation = "1.4.0"
androidxSplashscreen = "1.2.0"
androidxWork = "2.12.0"
androidxDatastore = "1.2.1"
androidxRoom = "2.8.5"
androidxPaging = "3.5.3"
androidxGlance = "1.2.0"
androidxCamera = "1.6.2"
androidxSecurity = "1.1.0"

# --- compose --------------------------------------------------------------
composeBom = "2026.09.00"
# material3 поднят ВЫШЕ версии из BOM осознанно.
#   1.4.0 (из BOM) даёт: MaterialExpressiveTheme, MotionScheme.expressive(), ShortNavigationBar,
#                        WideNavigationRail, expressiveLightColorScheme().
#   1.5.0-beta01 добавляет ровно то, на чём держится «ощущение свободы» из задания:
#                        FloatingActionButtonMenu, ToggleFloatingActionButton,
#                        Horizontal/VerticalFloatingToolbar, MaterialShapes (35 форм),
#                        LoadingIndicator, ButtonGroup, SplitButton, ToggleButton,
#                        WavyProgressIndicator и новый Styles API (ComponentStyles).
# Проверено распаковкой AAR: в 1.4.0 этих классов нет. Вернуться на BOM-версию можно,
# убрав version.ref ниже — тогда из UI уйдут float-меню и плавающие тулбары.
material3 = "1.5.0-beta01"
composeAdaptive = "1.3.0"
nav3 = "1.2.0"
lifecycleViewmodelNav3 = "2.11.0"

# --- kotlinx --------------------------------------------------------------
coroutines = "1.11.0"
serialization = "1.11.0"
datetime = "0.8.0"
immutable = "0.4.0"

# --- прочее ---------------------------------------------------------------
coil = "3.6.3"
okhttp = "5.4.0"
osmdroid = "6.1.20"
timber = "5.0.1"

# --- офлайн-зрение --------------------------------------------------------
# MediaPipe Tasks Vision — преемник tensorflow-lite-task-vision (0.4.4, 2023 год).
# Ест те же .tflite с метаданными, что лежали в AiCameraAttractions.
mediapipeTasks = "1.1.1"
# LiteRT — новое имя рантайма TFLite. Нужен, только если понадобится своя модель
# без task-уровня; для классификации хватает MediaPipe.
litert = "2.3.0"

# --- AI / агенты ----------------------------------------------------------
# Firebase AI Logic — облачный Gemini без своего бэкенда и без ключа в APK.
firebaseBom = "34.7.0"
# ML Kit GenAI Prompt API — Gemini Nano на устройстве (офлайн, бесплатно).
mlkitGenaiPrompt = "1.0.0-beta4"
# ADK Kotlin для Android — агентный рантайм (LlmAgent, @Tool, сессии) внутри приложения.
adkKotlin = "1.4.0"
# A2UI — агент возвращает описание UI, рендерится нативным Compose.
a2ui = "1.0.0-alpha01"
# AppFunctions — приложение как MCP-сервер для системного Gemini.
appfunctions = "1.0.0-alpha13"
# Kotlin MCP SDK — клиент/сервер Model Context Protocol на Kotlin.
mcpKotlin = "0.15.0"

# --- тесты ----------------------------------------------------------------
junit = "4.13.2"
androidxTest = "1.7.0"
androidxTestExt = "1.3.0"
androidxTestRunner = "1.7.0"
espresso = "3.7.0"
turbine = "1.2.1"
truth = "1.4.5"
robolectric = "4.17"

[libraries]
# --- gradle-плагины как зависимости build-logic --------------------------
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
hilt-gradlePlugin = { module = "com.google.dagger:hilt-android-gradle-plugin", version.ref = "hilt" }
room-gradlePlugin = { module = "androidx.room:room-gradle-plugin", version.ref = "androidxRoom" }

# --- androidx ядро --------------------------------------------------------
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
